name: Release installer (Windows)
# Run by pushing a tag like v1.0.0, or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty to only build artifacts."
        required: false
        default: ""
      commit:
        description: "Commit SHA to build and tag (defaults to the selected ref)."
        required: false
        default: ""

# Least privilege: jobs get a read-only token unless they ask for more.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip }
      - run: choco install innosetup -y --no-progress
      - run: pip install -e ".[dev,sim,voice]"
      - run: python packaging/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: windows-installer, path: dist/SkyDispatch-Setup-*.exe }

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ inputs.commit || github.sha }}
          files: artifacts/*
          generate_release_notes: true
